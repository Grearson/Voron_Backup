#####################################################################

[fan]
pin: EBBCan:gpio13                       # Pin for general fan control

[heater_fan hotend_fan]                  # Hotend Cooling Fan
pin: EBBCan:gpio14                       # Pin for hotend fan control
heater: extruder                         # Heater associated with this fan
heater_temp: 70.0                        # Temperature at which the fan activates

