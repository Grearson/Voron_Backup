# sense_resistor: 0.022                 # Sense resistor value for TMC5160 Plus
# run_current: 1.2                      # Motor running current value (mA) 0.9 A
# interpolate: true                    # Whether to enable 256 microstep interpolation
# stealthchop_threshold: 0		# Mute threshold, 0 = Spreadcycle

# 1. This product uses a 0.022R sampling resistor, so the maximum effective driving current is 10.6A.
# 2. Pay attention to the power sequence; ensure the driver power is turned on before the logic power. That is, turn on the driver power first, then power on the motherboard.
# 3. Regardless of whether the driver uses high or low voltage power delivery, the output voltage from the main control board to the drive must not exceed 24V; exceeding this will damage the driver.

#####################################################################
