#######################################################################################
##                                  Stepper Settings                                 ##
#######################################################################################

# MOTOR1, MOTOR2_1, MOTOR2_2, MOTOR3a, MOTOR3b, MOTOR4, MOTOR5, MOTOR6, MOTOR7, MOTOR8

#####################################################################
##                   X-axis on MOTOR1(B Motor)
#####################################################################

## X Stepper on Motor1 (B Motor - Left)
[stepper_x]
step_pin: PE2                           # Y-axis motor pulse pin setting
dir_pin: PE1                            # Y-axis motor direction pin setting !PE1 to reverse
enable_pin: !PE4                        # Y-axis motor enable pin setting
# step_pin: PE6                           # X-axis motor pulse pin setting
# dir_pin: PE5                            # X-axis motor direction pin setting !PE5 to reverse
# enable_pin: !PC14                       # X-axis motor enable pin setting
microsteps: 32                          # Motor microsteps setting
rotation_distance: 40                   # Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200            # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
# endstop_pin: ^PF4
endstop_pin: ^EBBCan:gpio24             # Limit switch pin setting (X-) #Stop0
# endstop_pin:tmc2209_stepper_x:virtual_endstop  # for Sensorless Homing
position_min: -3                         # X-axis minimum travel - software limit
position_max: 350                       # X-axis maximum travel - software limit
position_endstop: 350                   # Mechanical reset point coordinates for X-axis
homing_speed: 150                       # Reset speed - maximum 150
homing_retract_dist: 5                  # Setback distance after the first trigger of the reset switch
homing_positive_dir: true

[tmc2209 stepper_x]                     # TMC2209
uart_pin: PE3                           # UART pin for TMC2209 driver communication
# uart_pin: PC13                          # UART pin for TMC2209 driver communication
#diag_pin: PF4                          # Diag pin for Stallguard feature
interpolate: True                       # Whether to enable 256 microstep interpolation
run_current: 0.9                        # Motor running current value (mA) 0.9 A
sense_resistor: 0.110                   # Sense resistor value
stealthchop_threshold: 99999            # Mute threshold, 0 = Spreadcycle
# driver_SGTHRS:70                      # stealthchop must be 0

# [tmc5160 stepper_x]                   # TMC5160 Plus
# cs_pin: PC13				# Chip select pin for TMC5160 Plus driver
# spi_software_sclk_pin: PG6            # SPI software clock pin
# spi_software_mosi_pin: PG7            # SPI software MOSI pin
# spi_software_miso_pin: PG8            # SPI software MISO pin
##diag1_pin: PF4                        # Diag pin for Stallguard feature
# sense_resistor: 0.022                 # Sense resistor value for TMC5160 Plus
# run_current: 1.2                      # Motor running current value (mA) 0.9 A
# interpolate: true                     # Whether to enable 256 microstep interpolation
# stealthchop_threshold: 0		# Mute threshold, 0 = Spreadcycle

# 1. This product uses a 0.022R sampling resistor, so the maximum effective driving current is 10.6A.
# 2. Pay attention to the power sequence; ensure the driver power is turned on before the logic power. That is, turn on the driver power first, then power on the motherboard.
# 3. Regardless of whether the driver uses high or low voltage power delivery, the output voltage from the main control board to the drive must not exceed 24V; exceeding this will damage the driver.

