#####################################################################
# 	Extruder
#####################################################################

#	E0 on SB2209
[extruder]
step_pin: EBBCan:gpio18                 # Extruder motor pulse pin
dir_pin: EBBCan:gpio19                  # Extruder motor direction pin setting !EBBCan:gpio19 to reverse
enable_pin: !EBBCan:gpio17              # Extruder motor enable pin setting
microsteps: 16                          # Motor microsteps setting
rotation_distance: 22.333097095725      # Rotation distance, Re-calibrate your own value
gear_ratio: 50:10                       # Gear ratio of the Motorgearbox
nozzle_diameter: 0.400                  # Nozzle diameter
filament_diameter: 1.750                # Filament diameter
heater_pin: EBBCan:gpio7                # Heater pin
#control: pid                            # Control method
min_temp: 0                             # Minimum temperature
max_temp: 320                           # Maximum temperature
max_extrude_only_distance: 150          # Maximum length in mm filament for retraction/extrusion
max_extrude_cross_section: 2            # Maximum area (in mm^2) of an extrusion cross section (eg, extrusion width multiplied by layer height) 5
#pid_kp: 57.369                          # Proportional parameter of the PID controller
#pid_ki: 2.533                           # Integral parameter of the PID controller
#pid_kd: 324.854                         # Derivative parameter of the PID controller
# sensor_type: EPCOS 100K B57560G104F
# sensor_pin: EBBCan:gpio27
sensor_type: MAX31865                   # Temperature sensor type
sensor_pin: EBBCan:gpio9                # Temperature sensor Pin
spi_software_sclk_pin: EBBCan:gpio10    # SPI software clock pin
spi_software_mosi_pin: EBBCan:gpio8     # SPI software MOSI pin
spi_software_miso_pin: EBBCan:gpio11    # SPI software MISO pin
rtd_nominal_r: 1000    # 100 lt. Formbot
rtd_reference_r: 4300
rtd_num_of_wires: 2

[verify_heater extruder]
max_error: 25
check_gain_time: 15
hysteresis: 5
heating_gain: 2

[tmc2209 extruder]                      # TMC2209
uart_pin: EBBCan:gpio20                 # UART pin for TMC2209 driver communication
run_current: 0.65                       # Motor running current value (A) 0.65 A
stealthchop_threshold: 0                # Mute threshold

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA1                         # Heater pin - SSR @ HE1 Connector
sensor_type: Generic 3950               # Temperature sensor type
sensor_pin: PB1                         # Temperature sensor Pin - THB
max_power: 1.0                          # Maximum power for the heater or fan
min_temp: 0                             # Minimum temperature threshold
max_temp: 115                           # Maximum temperature threshold
#control: pid                            # Control method
#pid_kp: 58.437                          # Proportional parameter of the PID controller
#pid_ki: 2.347                           # Integral parameter of the PID controller
#pid_kd: 363.769                         # Derivative parameter of the PID controller
pwm_cycle_time: 0.0166                  # 60 Hz @ 240V

[verify_heater heater_bed]
max_error: 20
check_gain_time: 360
hysteresis: 5
heating_gain: 1

#####################################################################
# 	Thermistors
#####################################################################

[temperature_sensor chamber]
sensor_type: Generic 3950               # Temperature sensor type
sensor_pin: PB0                         # Temperature sensor Pin - TH0
min_temp: 0
max_temp: 80

#####################################################################
# 	Probe
#####################################################################

#Voron Tap
[probe]
pin: ^EBBCan:gpio22                     # Probe pin
x_offset: 0                             # X-offset from Nozzle in mm
y_offset: 0                             # Y-offset from Nozzle in mm
#z_offset: 0                             # Z-offset from Nozzle in mm, calibrate!
lift_speed: 30                          # Speed in mm/s for Probing touches
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

