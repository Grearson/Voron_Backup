#######################################################################################
##                                      MCU CB1                                      ##
#######################################################################################

# # host MCU service is preinstalled and ready to use with:
# [mcu CB1]
# serial: /tmp/klipper_host_mcu

#######################################################################################
##                               MCU Manta M8P V2.0                                  ##
#######################################################################################

# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

# See docs/Config_Reference.md for a description of parameters.
                                        # 

[mcu]
#  The following command is used to view the ID of canbus and needs to be entered in the SSH terminal.
#  “~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0”
 
canbus_uuid: bfac70cf5b96       	# Insert the CANbus-UUID of your Manta from the firmware flashing steps
canbus_interface: can0                  # CAN bus interface.
# restart_method: command

#######################################################################################
##                                   MCU EBB36_Gen2                                  ##
#######################################################################################

# This file contains common pin mappings for the BIGTREETECH EBB36
# GEN2 board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)" .
# The "EBB36 GEN2" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBB]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_33000F000450315741363420-if00
#canbus_uuid=a62a88bb28e3            	# Insert the CANbus-UUID of your EBB36 Gen2 from the firmware flashing steps
#canbus_interface: can0                 # CAN bus interface
# restart_method: command                 # Not needed for Boards using CAN

#######################################################################################
##                               MCU Carthographer V4                                ##
#######################################################################################

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_270046001850303655333520-if00
# #canbus_uuid: <blank>
# restart_method: command                 # Not needed for probes using CAN

#######################################################################################
##                                    Mechanics                                      ##
#######################################################################################

[printer]
kinematics: corexy                      # Printer type: corexy.
max_velocity: 300                       # Maximum speed (max. 300 mm/s).
max_accel: 7500                        # Maximum acceleration (max. 10000 mm/s²).
max_z_velocity: 30                      # Z-axis maximum speed (30 mm/s).
max_z_accel: 350                        # Z-axis maximum acceleration (350 mm/s²).
square_corner_velocity: 5.0             # Square corner velocity (5.0 mm/s).

#####################################################################
# 	                   Thermistors
#####################################################################

[temperature_sensor chamber]
sensor_type: Generic 3950               # Temperature sensor type
sensor_pin: PB0                         # Temperature sensor Pin - TH0
min_temp: 0                             # Minimum temperature threshold
max_temp: 70                            # Maximum temperature threshold

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

[temperature_sensor EBB36]
sensor_type: Generic 3950               # Temperature sensor type
sensor_pin: EBB:PA0                     # Temperature sensor Pin
pullup_resistor: 2200                   # Temperature sensor Pullup Resistor

[temperature_sensor cartographer]
sensor_type: temperature_mcu            # Temperature sensor type
sensor_mcu: cartographer
min_temp: 0                             # Minimum temperature threshold
max_temp: 105                           # Maximum temperature threshold

#####################################################################
##                           Client Variables
#####################################################################

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 5.0
variable_custom_park_y    : 5.0
variable_custom_park_dz   : 5.0
variable_retract          : 3.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 3.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_runout_sensor    : "filament_switch_sensor switch_sensor"
gcode:

#####################################################################
##                           Includes
#####################################################################

[include macros.cfg]
[include mainsail.cfg]
[include stealthburner_leds.cfg]
[include TMC_Autotune.cfg]
[include timelapse.cfg]

[force_move]
enable_force_move: true
#   Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION
#   extended G-Code commands. The default is false.
#   FORCE_MOVE STEPPER=<config_name> DISTANCE=<value> VELOCITY=<value> [ACCEL=<value>]
#   FORCE_MOVE STEPPER=stepper_x DISTANCE=5 VELOCITY=60
#   SET_KINEMATIC_POSITION [X=<value>] [Y=<value>] [Z=<value>] [SET_HOMED=<[X][Y][Z]>] or [CLEAR_HOMED=<[X][Y][Z]>]

[exclude_object]
[display_status]
[pause_resume]

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes


#######################################################################################
##                                  Stepper Settings                                 ##
#######################################################################################

# MOTOR1, MOTOR2_1, MOTOR2_2, MOTOR3a, MOTOR3b, MOTOR4, MOTOR5, MOTOR6, MOTOR7, MOTOR8

#####################################################################
##                   X-axis on MOTOR1(B Motor)
#####################################################################

## X Stepper on Motor1 (B Motor - Left)
[stepper_x]
step_pin: PE2                           # Y-axis motor pulse pin setting
dir_pin: PE1                            # Y-axis motor direction pin setting !PE1 to reverse
enable_pin: !PE4                        # Y-axis motor enable pin setting
# step_pin: PE6                         # X-axis motor pulse pin setting
# dir_pin: PE5                          # X-axis motor direction pin setting !PE5 to reverse
# enable_pin: !PC14                     # X-axis motor enable pin setting
microsteps: 32                          # Motor microsteps setting
rotation_distance: 40                   # Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200            # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
# endstop_pin: ^PF4                     # Limit switch pin setting (X-) #Stop0
endstop_pin: ^EBB:PA15                  # Limit switch pin setting (X-) #Stop0
# endstop_pin:tmc2209_stepper_x:virtual_endstop  # for Sensorless Homing
position_min: -3                        # X-axis minimum travel - software limit
position_max: 350                       # X-axis maximum travel - software limit
position_endstop: 350                   # Mechanical reset point coordinates for X-axis
homing_speed: 150                       # Reset speed - maximum 150
homing_retract_dist: 5                  # Setback distance after the first trigger of the reset switch
homing_positive_dir: true

[tmc2209 stepper_x]                     # TMC2209
uart_pin: PE3                           # UART pin for TMC2209 driver communication
# uart_pin: PC13                          # UART pin for TMC2209 driver communication
#diag_pin: PF4                          # Diag pin for Stallguard feature
interpolate: True                       # Whether to enable 256 microstep interpolation
run_current: 1.2                        # Motor running current value (mA) 0.9 A
sense_resistor: 0.110                   # Sense resistor value
stealthchop_threshold: 99999            # Mute threshold, 0 = Spreadcycle
# driver_SGTHRS:70                      # stealthchop must be 0

# [tmc5160 stepper_x]                   # TMC5160 Plus
# cs_pin: PC13				# Chip select pin for TMC5160 Plus driver
# spi_software_sclk_pin: PG6            # SPI software clock pin
# spi_software_mosi_pin: PG7            # SPI software MOSI pin
# spi_software_miso_pin: PG8            # SPI software MISO pin
##diag1_pin: PF4                        # Diag pin for Stallguard feature
# sense_resistor: 0.022                 # Sense resistor value for TMC5160 Plus
# run_current: 1.2                      # Motor running current value (mA) 0.9 A
# interpolate: true                     # Whether to enable 256 microstep interpolation
# stealthchop_threshold: 0		# Mute threshold, 0 = Spreadcycle

# 1. This product uses a 0.022R sampling resistor, so the maximum effective driving current is 10.6A.
# 2. Pay attention to the power sequence; ensure the driver power is turned on before the logic power. That is, turn on the driver power first, then power on the motherboard.
# 3. Regardless of whether the driver uses high or low voltage power delivery, the output voltage from the main control board to the drive must not exceed 24V; exceeding this will damage the driver.

