#####################################################################
# 	Extruder
#####################################################################

#	E0 on EBB36_Gen2
[extruder]
step_pin: EBB:PB14                      # Extruder motor pulse pin
dir_pin: EBB:PA8                        # Extruder motor direction pin setting !EBBCan:gpio19 to reverse
enable_pin: !EBB:PB6                    # Extruder motor enable pin setting
microsteps: 16                          # Extruder motor microsteps setting
# rotation_distance: 50.177               # Rotation distance, Re-calibrate your own value
# gear_ratio: 11.25:1                     # Gear ratio of the Motorgearbox
rotation_distance: 52.424               # Re-calibrate your own value
gear_ratio: 44:10, 37:17                # Gear ratio of the Motorgearbox
nozzle_diameter: 0.600                  # Nozzle diameter
filament_diameter: 1.750                # Filament diameter
heater_pin: EBB:PB4                     # Heater pin
min_temp: 0                             # Minimum temperature
max_temp: 300                           # Maximum temperature
max_extrude_only_distance: 150          # Maximum length in mm filament for retraction/extrusion
max_extrude_cross_section: 5            # Maximum area (in mm^2) of an extrusion cross section (eg, extrusion width multiplied by layer height) 5
#control: pid                           # Control method
#pid_kp: 57.369                         # Proportional parameter of the PID controller
#pid_ki: 2.533                          # Integral parameter of the PID controller
#pid_kd: 324.854                        # Derivative parameter of the PID controller
# sensor_type: EPCOS 100K B57560G104F   # Temperature sensor type
sensor_type: Generic 3950
# sensor_type: PT1000                     # Temperature sensor type
pullup_resistor: 2200                   # Temperature sensor Pullup Resistor
sensor_pin: EBB:PA3                     # Temperature sensor Pin

[verify_heater extruder]
max_error: 25
check_gain_time: 15
hysteresis: 5
heating_gain: 2

[tmc2209 extruder]                      # TMC2209
uart_pin: EBB:PB3                       # UART pin for TMC2209 driver communication
run_current: 0.500                      # Motor running current value (A) 0.65 A
stealthchop_threshold: 0                # Mute threshold

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA1                         # Heater pin - SSR @ HE1 Connector
sensor_type: Generic 3950               # Temperature sensor type
sensor_pin: PB1                         # Temperature sensor Pin - THB
max_power: 1.0                          # Maximum power for the heater or fan
min_temp: 0                             # Minimum temperature threshold
max_temp: 115                           # Maximum temperature threshold
#control: pid                           # Control method
#pid_kp: 58.437                         # Proportional parameter of the PID controller
#pid_ki: 2.347                          # Integral parameter of the PID controller
#pid_kd: 363.769                        # Derivative parameter of the PID controller
pwm_cycle_time: 0.0166                  # 60 Hz @ 240V

[verify_heater heater_bed]
max_error: 20
check_gain_time: 360
hysteresis: 5
heating_gain: 1

#####################################################################
# 	Carthographer v4
#####################################################################

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 21.65 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output

