#######################################################################################
##                                       Macros                                      ##
#######################################################################################

[gcode_macro G29]
gcode:
    STATUS_MESHING
    BED_MESH_CALIBRATE

[gcode_macro G32]
gcode:
    STATUS_LEVELING
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X175 Y175 Z30 F3600

[gcode_macro FILTER_ON]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0.8

[gcode_macro FILAMENT_RUNOUT]
description: Filament Runout Handler
gcode:
  M117 Filament leer!
  PAUSE

[gcode_macro FILTER_OFF]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

[gcode_macro Save_Cfg]
gcode:
    Save_Config

[gcode_macro CHOME]
gcode:
    {% if ('x' not in printer.toolhead.homed_axes)
       or ('y' not in printer.toolhead.homed_axes)
       or ('z' not in printer.toolhead.homed_axes) %}
        STATUS_HOMING
        G28
    {% endif %}


[gcode_macro CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 ; home if not already homed
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}

[gcode_macro Back]
description: Moves Toolhead to the Back
gcode:
    CHOME
    {%set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
    {%set y_center = printer.toolhead.axis_maximum.y|float / 2.0 %}
    G90
    G1 X{x_center} Y110 F7800

# Park top rear
[gcode_macro PARKREAR]
gcode:
    CHOME
    SAVE_GCODE_STATE NAME=PARKREAR
    G90                              ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y-10} Z{printer.toolhead.axis_maximum.z-50} F6000     
    RESTORE_GCODE_STATE NAME=PARKREAR


# Park front center
[gcode_macro PARKFRONT]
gcode:
    CHOME
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F6000        
    RESTORE_GCODE_STATE NAME=PARKFRONT

# Park at center of build volume
[gcode_macro PARKCENTER]
gcode:
    CHOME
    SAVE_GCODE_STATE NAME=PARKCENTER
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z{printer.toolhead.axis_maximum.z/2} F6000    
    RESTORE_GCODE_STATE NAME=PARKCENTER

# Park 15mm above center of bed
[gcode_macro PARKBED]
gcode:
    CHOME
    SAVE_GCODE_STATE NAME=PARKBED
    G90                                ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F6000                                     
    RESTORE_GCODE_STATE NAME=PARKBED



#####################################################################
#                           Klipper Backup
#####################################################################

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

#####################################################################
# 	                     LED-Control
#####################################################################
[gcode_macro lights_off]
gcode:
    SET_PIN PIN=caselight VALUE=0
    set_logo_leds_off transmit=0
    set_nozzle_leds_off
     
[gcode_macro lights_on]
gcode:
    SET_PIN PIN=caselight VALUE=1
    _set_sb_leds_by_name leds="logo" color="standby" transmit=1
    _set_sb_leds_by_name leds="nozzle" color="on" transmit=1
 
[gcode_macro lights_toggle]
gcode:
    {% if printer['output_pin caselight'].value == 1 %}
        lights_off
    {% else %}
        lights_on
    {% endif %}    

