#####################################################################
#                         Heat Soak                                 
#####################################################################

[gcode_macro HEATSOAK]
description: Preheat bed for chamber with cancel support
variable_running: 0
variable_duration: 0         # total duration in seconds
variable_elapsed: 0          # elapsed seconds
gcode:
    {% set BED = params.BED|default(105)|float %}
    {% set AMBIENT = params.AMBIENT|default(40)|float %}
    {% set DELAY = params.DELAY|default(15)|float %}
    {% set SKIP = params.SKIP|default(0)|int %}
    {% set mid_x = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set mid_y = printer.toolhead.axis_maximum.y|float / 2 %}

    {% if SKIP == 1 %}
        M117 Heatsoak skipped
        RETURN
    {% endif %}

    {% if printer["gcode_macro HEATSOAK"].running|int == 1 %}
        M117 Heatsoak already running!
        RETURN
    {% endif %}

    STATUS_HEATING
    M117 Bed:{BED}C Amb:{AMBIENT}C
    M118 Preheating {BED}C for {DELAY} minutes

    ; Set temperatures
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED}

    ; Home only if needed
    CHOME

    ; Move to center above bed
    G0 X{mid_x} Y{mid_y} Z15 F2000

    ; Turn on part cooling fan at 30%
    M106 P0 S76

    ; Initialize timing variables
    SET_GCODE_VARIABLE MACRO=HEATSOAK VARIABLE=running VALUE=1
    SET_GCODE_VARIABLE MACRO=HEATSOAK VARIABLE=duration VALUE={(DELAY*60)|int}
    SET_GCODE_VARIABLE MACRO=HEATSOAK VARIABLE=elapsed VALUE=0

    ; Start delayed loop
    UPDATE_DELAYED_GCODE ID=HEATSOAK_LOOP DURATION=5
    M118 Heatsoak started (non-blocking)


# ============================================================
# Handler macro called by delayed_gcode
# ============================================================
[gcode_macro _HEATSOAK_HANDLER]
gcode:
    {% set macro = printer["gcode_macro HEATSOAK"] %}
    {% set running = macro.running|int %}
    {% if running == 1 %}
        {% set elapsed = macro.elapsed|int + 5 %}  ; count 5 seconds per loop
        {% set duration = macro.duration|int %}
        {% set remaining = duration - elapsed %}

        {% if remaining > 0 %}
            {% set min_left = (remaining // 60) %}
            {% set sec_left = (remaining % 60) %}
            M117 Heatsoaking… {min_left}m {sec_left}s left

            SET_GCODE_VARIABLE MACRO=HEATSOAK VARIABLE=elapsed VALUE={elapsed}
            UPDATE_DELAYED_GCODE ID=HEATSOAK_LOOP DURATION=5
        {% else %}
            M117 Waiting for extruder to cool...
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM=40
            M106 P0 S0
            SET_GCODE_VARIABLE MACRO=HEATSOAK VARIABLE=running VALUE=0
            STATUS_READY
            M117 Heatsoak complete
            M118 Heatsoak complete
            UPDATE_DELAYED_GCODE ID=_CLEAR_DISPLAY DURATION=60
            M300 S440 P1000
        {% endif %}
    {% endif %}


# ============================================================
# Delayed gcode just calls handler
# ============================================================
[delayed_gcode HEATSOAK_LOOP]
gcode:
    _HEATSOAK_HANDLER


# ============================================================
# Skip / cancel macro
# ============================================================
[gcode_macro HEATSOAK_SKIP]
description: Skip or cancel current heatsoak
gcode:
    {% set macro = printer["gcode_macro HEATSOAK"] %}
    {% if macro.running|int == 1 %}
        M118 Heatsoak canceled by user
        M106 P0 S0
        M104 S0
        M140 S0
        SET_GCODE_VARIABLE MACRO=HEATSOAK VARIABLE=running VALUE=0
        UPDATE_DELAYED_GCODE ID=HEATSOAK_LOOP DURATION=0
        STATUS_READY
        M117 Heatsoak canceled
    {% else %}
        M117 No active heatsoak
    {% endif %}

#####################################################################
#                         Nozzle Cleaning                                 
#####################################################################

[gcode_macro CLEAN_NOZZLE_TAP]
description: "Clean nozzle by wiping on brush - customizable"

variable_brush_start_x: 115
variable_brush_end_x: 145
variable_brush_y: 349
variable_brush_z: 4.5
variable_end_x: 200
variable_end_y: 100
variable_end_z: 7.5
variable_wipe_repeat: 5
variable_zigzag_repeat: 3

gcode:
    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

    CHOME
    G90 ; Absolute positioning
    M117 Cleaning nozzle...

    {% if printer.extruder.temperature < 170 %}
        M117 Nozzle temp too low for cleaning!
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM=170
    {% endif %}

    G1 X{brush_start_x} Y{brush_y} F9000
    G1 Z{brush_z} F300

    {% for i in range(wipe_repeat) %}
        G1 X{brush_end_x} F4500
        G1 X{brush_start_x} F4500
    {% endfor %}

    G1 Z{brush_z + 4} F6000
    G1 X{brush_start_x} Y{brush_y - 4} F6000
    G1 Z{brush_z} F300

    {% set x = brush_start_x %}
    {% set step = 2 %}
    {% for i in range(zigzag_repeat) %}
        G1 Y{brush_y} X{x + step} F6000
        G1 Y{brush_y - 3} X{x + step + 2} F6000
        G1 Y{brush_y} X{x + step + 4} F6000
        G1 Y{brush_y - 3} X{x + step + 6} F6000
        G1 Y{brush_y} X{x + step + 8} F6000
    {% endfor %}

    G1 X{end_x} Y{end_y} Z{end_z} F6000

    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

#####################################################################
# 			    Nozzle Purge
#####################################################################

[gcode_macro NOZZLE_PURGE]
description: Draw a purge line at the front left edge of the build plate
gcode:
  CHOME
  G0 X2.5 Y2 F6000 ; Go to front
  G0 Z0.2 ; Drop to bed
  M83 ; Set extruder to relative mode
  G1 X25 E10 F500 ; Extrude 25mm of filament in a 4cm line
  G1 X50 F5000 ; Quickly wipe away from the filament line
  G1 X75 E2.00 F1500
  G1 E-0.1 F400 ; Retract a little
  G1 Z0.5 ; Raise and begin printing.

######################################################################
#                           Filament Load/Unload
######################################################################

[gcode_macro _NEBULA_VARIABLE]
# unload
variable_unload_purge_distance: 35   # (mm) purge a distance before unload to clean filament
variable_unload_purge_speed:    300  # (mm/min) purge speed
variable_unload_distance:       120  # (mm) unload distance
variable_unload_speed:          1200 # (mm/min) unload Speed, 3000 
# load
variable_load_distance:         40   # (mm) load distance
variable_load_speed:            1200 # (mm/min) load speed
variable_load_purge_distance:   30   # (mm) purge a distance after load
variable_load_purge_speed:      300  # (mm/min) purge speed
gcode:

# Endstop Port on EBB36, 5v, gnd, PB6/FS, PB5/GB, PB7/LED

[respond]
default_type: echo

[gcode_macro UNLOAD_FILAMENT]
# [gcode_macro NEBULA_UNLOAD_FILAMENT]
gcode:
  {% set nebula = printer['gcode_macro _NEBULA_VARIABLE'] %}
  {% set unload_purge_distance = nebula.unload_purge_distance %}
  {% set unload_purge_speed = nebula.unload_purge_speed %}
  {% set unload_distance = nebula.unload_distance %}
  {% set unload_speed = nebula.unload_speed %}
  {% set was_cold = printer.extruder.target == 0 %}

  SAVE_GCODE_STATE NAME=tmp_unload_state

  {% set target = printer.extruder.target|default(220)|float %}
  {% if target < 230 %}
    M109 S230
  {% else %}
    M109 S{target}
  {% endif %}

  G91
  M83
  G92 E0

  M118 Nebula unload purging
  G1 E{unload_purge_distance} F{unload_purge_speed}
  M400

  M118 Nebula unloading
  G1 E-{unload_distance} F{unload_speed}
  M400

  RESTORE_GCODE_STATE NAME=tmp_unload_state

  {% if was_cold %}
    M104 S0
  {% endif %}


[gcode_macro LOAD_FILAMENT]
# [gcode_macro NEBULA_LOAD_FILAMENT]
gcode:
  {% set nebula = printer['gcode_macro _NEBULA_VARIABLE'] %}
  {% set load_purge_distance = nebula.load_purge_distance %}
  {% set load_purge_speed = nebula.load_purge_speed %}
  {% set load_distance = nebula.load_distance %}
  {% set load_speed = nebula.load_speed %}
  {% set was_cold = printer.extruder.target == 0 %}

  SAVE_GCODE_STATE NAME=tmp_load_state

  {% set target = printer.extruder.target|default(220)|float %}
  {% if target < 230 %}
    M109 S230
  {% else %}
    M109 S{target}
  {% endif %}

  G91
  M83
  G92 E0

  M118 Nebula loading
  G1 E{load_distance} F{load_speed}
  M400

  M118 Nebula load purging
  G1 E{load_purge_distance} F{load_purge_speed}
  M400

  RESTORE_GCODE_STATE NAME=tmp_load_state

  {% if was_cold %}
    M104 S0
  {% endif %}


